<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#emeraldGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8"/>

  <!-- Mosque Dome Silhouette -->
  <!-- Main Central Arch/Dome -->
  <path d="M 256 120 C 215 165 175 205 175 270 L 337 270 C 337 205 297 165 256 120 Z" fill="#FFFFFF"/>
  <!-- Minaret Left -->
  <path d="M 130 215 L 150 215 L 150 340 L 130 340 Z" fill="#FFFFFF"/>
  <path d="M 125 215 L 140 185 L 155 215 Z" fill="url(#goldGrad)"/>
  <!-- Minaret Right -->
  <path d="M 362 215 L 382 215 L 382 340 L 362 340 Z" fill="#FFFFFF"/>
  <path d="M 357 215 L 372 185 L 387 215 Z" fill="url(#goldGrad)"/>
  
  <!-- Base Building -->
  <rect x="145" y="270" width="222" height="70" rx="6" fill="#FFFFFF"/>
  <!-- Door Arch -->
  <path d="M 226 340 L 226 300 C 226 280 286 280 286 300 L 286 340 Z" fill="url(#emeraldGrad)"/>
  
  <!-- Top Crescent Moon -->
  <path d="M 256 68 C 246 68 238 74 234 82 C 244 84 252 93 252 104 C 252 116 243 125 231 125 C 227 125 223 124 220 122 C 227 133 238 140 251 140 C 270 140 285 124 285 104 C 285 84 272 68 256 68 Z" fill="url(#goldGrad)"/>
  
  <!-- Twin Marriage Rings at Bottom Base -->
  <circle cx="230" cy="388" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
  <circle cx="282" cy="388" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
</svg>
